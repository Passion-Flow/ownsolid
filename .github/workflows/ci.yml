name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Layout, language and tooling checks
        run: make check-layout check-roadmap test-tools PYTHON=python3

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - uses: actions/setup-node@v6
        with:
          node-version: "26.13.0"
      - name: Install the pinned pnpm
        run: npm install --global pnpm@12.16.1
      - name: Build Go modules, the gateway and the web applications
        run: make build

  agent-cost:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm@sha256:c29f30688a9ad961691bdf0ec1650717cc132a5814619d80f80463d6e4c42e47
        env:
          POSTGRES_DB: ownsolid_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ownsolid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: false
      - id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare the test database
        run: psql -h 127.0.0.1 -U postgres -d ownsolid_test -c 'CREATE EXTENSION vector'
      - name: Measure every agent call against its declared cost
        run: make test-agent-cost
        env:
          PROJECT_ONE_TEST_DSN: postgres://postgres@127.0.0.1:5432/ownsolid_test?sslmode=disable
          PROJECT_ONE_DATA_PYTHON: ${{ steps.python.outputs.python-path }}

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "26.13.0"
      - name: Install the pinned pnpm
        run: npm install --global pnpm@12.16.1
      - name: Lint, format and type checks
        run: make check-web
      - name: Unit tests
        run: cd web && pnpm test
      - name: Install Chromium for browser tests
        run: cd web/apps/console && pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: make test-web-browser
