<!DOCTYPE html>
<html lang="en" data-theme="light" data-density="comfortable" data-accent="teal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ownsolid console prototype</title>
<style>
/* ---------- Bundled fonts (SIL OFL 1.1, see licenses/) ---------- */
@font-face { font-family: "Figtree"; src: url("fonts/figtree-latin-wght-normal.woff2") format("woff2"); font-weight: 300 900; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url("fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 800; font-display: swap; }

/* ---------- Design tokens ---------- */
:root {
  color-scheme: light;
  --bg: #f6f4ef;
  --surface: #fffefb;
  --surface-2: #f1eee7;
  --surface-3: #e7e3da;
  --border: #e5e0d5;
  --border-strong: #d3cdc0;
  --text: #1d1b18;
  --text-2: #59544b;
  --text-3: #8c8679;
  --deemph: #d8d2c5;
  --good: #0ca30c;
  --warning: #fab219;
  --critical: #d03b3b;
  --shadow-1: 0 1px 2px rgba(40, 32, 20, .05);
  --shadow-2: 0 8px 28px rgba(40, 32, 20, .10), 0 1px 3px rgba(40, 32, 20, .06);
  --shadow-3: 0 24px 64px rgba(40, 32, 20, .18), 0 2px 8px rgba(40, 32, 20, .08);
  --log-bg: #1b1916;
  --log-text: #ebe7df;
  --font-brand: "Figtree";
  --font-ui: var(--font-brand), -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius-s: 8px;
  --radius-m: 12px;
  --radius-l: 14px;
  --row: 52px;
  --gap: 20px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
:root[data-accent="teal"] { --accent: #0d9488; --accent-hover: #0b8378; --accent-soft: #e2f2ee; --accent-ink: #0a6f65; }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #161513;
  --surface: #211f1c;
  --surface-2: #2a2824;
  --surface-3: #33302b;
  --border: #36332e;
  --border-strong: #46423b;
  --text: #f3f0ea;
  --text-2: #bdb7ac;
  --text-3: #868074;
  --deemph: #46423b;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .35);
  --shadow-2: 0 8px 28px rgba(0, 0, 0, .4), 0 1px 3px rgba(0, 0, 0, .3);
  --shadow-3: 0 24px 64px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .4);
  --log-bg: #100f0d;
}
:root[data-theme="dark"][data-accent="teal"] { --accent: #14a394; --accent-hover: #1ab3a3; --accent-soft: #15302b; --accent-ink: #74d3c6; }
:root[data-density="compact"] { --row: 40px; --gap: 14px; }

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.5 var(--font-ui); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
svg.icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }
.muted { color: var(--text-2); }
.subtle { color: var(--text-3); }
.num { font-variant-numeric: tabular-nums; }
.link { color: var(--accent-ink); font-weight: 550; cursor: pointer; }
.link:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: 248px 1fr; height: 100vh; }
.sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 10px; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--text); display: grid; place-items: center; }
.brand-mark span { width: 11px; height: 11px; border-radius: 3px; background: var(--accent); transform: rotate(45deg); }
.brand-name { font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
.nav { padding: 4px 10px 20px; }
.nav-group { margin-top: 14px; }
.nav-label { font-size: 11.5px; font-weight: 600; color: var(--text-3); padding: 0 10px 4px; }
.nav-item { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: var(--radius-s); color: var(--text-2); cursor: pointer; font-weight: 500; transition: background .15s var(--ease), color .15s var(--ease); }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.nav-item .count { margin-left: auto; font-size: 11.5px; color: var(--text-3); }
.nav-item.disabled { opacity: .5; cursor: default; }
.nav-item.disabled:hover { background: none; color: var(--text-2); }
.sidebar-foot { margin-top: auto; padding: 14px; border-top: 1px solid var(--border); }
.airgap { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-m); background: var(--surface-2); }
.airgap b { display: block; font-size: 12.5px; }
.airgap small { color: var(--text-3); font-size: 11.5px; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); flex: none; }

.main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.topbar { height: 58px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 24px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: saturate(180%) blur(16px); position: sticky; top: 0; z-index: 5; }
.crumbs { display: flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 13px; }
.crumbs svg { width: 14px; height: 14px; }
.crumbs b { color: var(--text); font-weight: 600; }
.search { margin-left: auto; display: flex; align-items: center; gap: 8px; width: 320px; height: 36px; padding: 0 10px 0 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text-3); cursor: pointer; }
.search span { flex: 1; font-size: 13px; }
kbd { font: 11px var(--font-ui); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--text-3); background: var(--surface-2); line-height: 17px; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 10px; background: none; cursor: pointer; color: var(--text-2); position: relative; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn .dot { position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--critical); border: 2px solid var(--bg); }
.workspace { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 550; }
.ws-dot { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, #2bb3a3, #0b6e64); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; font-weight: 650; font-size: 13px; flex: none; }
.review { display: flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border-radius: 10px; border: 1px dashed var(--border-strong); font-size: 12px; color: var(--text-3); }
.swatch { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--border-strong); cursor: pointer; padding: 0; }
.swatch.on { box-shadow: 0 0 0 2px var(--text); }

.content { flex: 1; overflow-y: auto; }
.page { max-width: 1320px; margin: 0 auto; padding: 28px 28px 64px; animation: rise .3s var(--ease); }
@keyframes rise { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 22px; }
.page-head h1 { font-weight: 750; font-size: 27px; letter-spacing: -.03em; line-height: 1.2; margin: 0 0 4px; }
.page-head p { margin: 0; color: var(--text-2); }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex: none; }

/* ---------- Controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); font-weight: 550; cursor: pointer; transition: background .15s, border-color .15s, transform .1s; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.98); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: none; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.danger { color: var(--critical); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
.btn kbd { margin-left: 4px; background: transparent; color: inherit; opacity: .7; border-color: currentColor; }
.btn.primary kbd { border-color: rgba(255, 255, 255, .5); }
.segmented { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; }
.segmented button { border: 0; background: none; height: 28px; padding: 0 12px; border-radius: 7px; cursor: pointer; color: var(--text-2); font-weight: 500; font-size: 13px; white-space: nowrap; }
.segmented button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-1); }
.field { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface); color: var(--text-3); width: 100%; }
.field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field input { border: 0; outline: 0; background: none; color: var(--text); width: 100%; }
select.field { color: var(--text); }
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.toolbar .grow { flex: 1; max-width: 320px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 550; color: var(--text); white-space: nowrap; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); flex: none; }
.pill.good i { background: var(--good); }
.pill.warn i { background: var(--warning); }
.pill.crit i { background: var(--critical); }
.pill.live i { background: var(--accent); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--surface-2); font-size: 12px; color: var(--text-2); white-space: nowrap; }
.tag.accent { background: var(--accent-soft); color: var(--accent-ink); }
.copy { display: inline-flex; align-items: center; gap: 8px; }
.copy button { border: 0; background: none; cursor: pointer; color: var(--text-3); padding: 4px; border-radius: 6px; display: grid; }
.copy button:hover { background: var(--surface-2); color: var(--text); }
.copy button svg { width: 15px; height: 15px; }
input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; margin: 0; }

/* ---------- Cards ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-l); box-shadow: var(--shadow-1); }
.card-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px 2px; }
.card-head h3 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.card-head .sub { color: var(--text-3); font-size: 12.5px; }
.card-head .right { margin-left: auto; }
.card-body { padding: 12px 20px 18px; }
.grid { display: grid; gap: var(--gap); }
.g-4 { grid-template-columns: repeat(4, 1fr); }
.g-5 { grid-template-columns: repeat(5, 1fr); }
.g-2 { grid-template-columns: 1.55fr 1fr; }
.g-2e { grid-template-columns: 1fr 1fr; }
.stack { display: flex; flex-direction: column; gap: var(--gap); }
.mb { margin-bottom: var(--gap); }

.quick { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .15s; }
.quick:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.quick .qi { width: 36px; height: 36px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.quick b { display: block; font-size: 14px; }
.quick small { color: var(--text-3); font-size: 12.5px; }
.quick kbd { margin-left: auto; }

.tile { padding: 16px 18px; }
.tile .label { color: var(--text-2); font-size: 13px; font-weight: 500; }
.tile .value { font-size: 28px; font-weight: 700; letter-spacing: -.03em; margin-top: 6px; line-height: 1.1; }
.tile .value small { font-size: 14px; color: var(--text-3); font-weight: 500; margin-left: 3px; letter-spacing: 0; }
.tile .foot { margin-top: 10px; font-size: 12.5px; color: var(--text-3); display: flex; align-items: center; gap: 8px; min-height: 20px; }
.meter { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; flex: 1; }
.meter b { display: block; height: 100%; border-radius: 3px; background: var(--text-3); }
.meter.accent b { background: var(--accent); }

/* ---------- Tables ---------- */
.table { width: 100%; border-collapse: separate; border-spacing: 0; }
.table th { text-align: left; font-size: 12px; font-weight: 600; color: var(--text-3); padding: 0 14px; height: 40px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface); }
.table td { padding: 0 14px; height: var(--row); border-bottom: 1px solid var(--border); white-space: nowrap; }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr { cursor: pointer; transition: background .12s; }
.table tbody tr:hover td { background: var(--surface-2); }
.table tbody tr.sel td { background: var(--accent-soft); }
.table .w-check { width: 44px; padding-right: 0; }
.row-actions { opacity: 0; transition: opacity .12s; display: flex; gap: 2px; justify-content: flex-end; }
.table tbody tr:hover .row-actions { opacity: 1; }
.cell-title { font-weight: 600; }
.cell-sub { font-size: 12px; color: var(--text-3); }
.bar-cell { display: flex; align-items: center; gap: 10px; min-width: 120px; }
.bar-cell .num { width: 36px; text-align: right; font-size: 12.5px; color: var(--text-2); }
.chips { display: flex; gap: 3px; }
.chip-gpu { width: 9px; height: 18px; border-radius: 3px; background: var(--surface-3); }
.chip-gpu.busy { background: var(--accent); }
.chip-gpu.idle { background: var(--deemph); }
.bulkbar { position: sticky; bottom: 20px; margin: 14px auto 0; width: max-content; display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; border-radius: 14px; background: var(--text); color: var(--bg); box-shadow: var(--shadow-3); transform: translateY(12px); opacity: 0; pointer-events: none; transition: all .2s var(--ease); }
.bulkbar.show { transform: none; opacity: 1; pointer-events: auto; }
.bulkbar .btn { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 30%, transparent); }
.bulkbar .btn:hover { background: color-mix(in srgb, var(--bg) 12%, transparent); }

/* ---------- Lists ---------- */
.list-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.list-item:last-child { border-bottom: 0; }
.li-icon { width: 30px; height: 30px; border-radius: 9px; background: var(--surface-2); display: grid; place-items: center; color: var(--text-2); flex: none; }
.li-icon svg { width: 16px; height: 16px; }
.li-icon.warn { background: color-mix(in srgb, var(--warning) 18%, var(--surface)); color: #8a5a00; }
.li-icon.crit { background: color-mix(in srgb, var(--critical) 13%, var(--surface)); color: var(--critical); }
:root[data-theme="dark"] .li-icon.warn { color: var(--warning); }
.li-main { flex: 1; min-width: 0; }
.li-title { font-weight: 600; }
.li-meta { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
.li-actions { display: flex; gap: 6px; margin-top: 8px; }
.li-time { font-size: 12px; color: var(--text-3); white-space: nowrap; }
.setup-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 13.5px; }
.setup-item .box { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--border-strong); display: grid; place-items: center; flex: none; }
.setup-item.done .box { background: var(--good); border-color: var(--good); color: #fff; }
.setup-item.done span { color: var(--text-3); text-decoration: line-through; }
.setup-item .box svg { width: 11px; height: 11px; stroke-width: 3; }
.setup-item .link { margin-left: auto; font-size: 13px; }
.assure { display: grid; grid-template-columns: repeat(4, 1fr); }
.assure div { padding: 14px 20px; border-right: 1px solid var(--border); }
.assure div:last-child { border-right: 0; }
.assure b { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.assure small { display: block; color: var(--text-3); margin-top: 3px; font-size: 12.5px; }
.check { width: 18px; height: 18px; border-radius: 50%; background: color-mix(in srgb, var(--good) 16%, var(--surface)); color: var(--good); display: grid; place-items: center; flex: none; }
.check svg { width: 12px; height: 12px; stroke-width: 2.6; }

/* ---------- Charts ---------- */
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .grid-line { stroke: var(--border); stroke-width: 1; }
.chart .axis-text { fill: var(--text-3); font-size: 11px; font-family: var(--font-ui); }
.chart .series-line { stroke: var(--accent); stroke-width: 2; fill: none; }
.chart .series-area { fill: var(--accent); opacity: .10; }
.chart .crosshair { stroke: var(--text-3); stroke-width: 1; }
.chart .marker { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.tooltip { position: absolute; pointer-events: none; padding: 8px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-2); font-size: 12.5px; white-space: nowrap; opacity: 0; transition: opacity .12s; z-index: 3; }
.tooltip strong { display: block; font-size: 14px; }
.tooltip span { color: var(--text-3); }
.table-view { margin-top: 6px; font-size: 12.5px; color: var(--text-3); }
.table-view summary { cursor: pointer; width: max-content; }
.table-view .table td { height: 30px; }
.table-view tbody tr { cursor: default; }
.hbar { display: grid; grid-template-columns: 150px 1fr 64px; align-items: center; gap: 12px; height: 34px; border-radius: 8px; padding: 0 6px; margin: 0 -6px; }
.hbar:hover { background: var(--surface-2); }
.hbar .fill { height: 10px; border-radius: 0 4px 4px 0; background: var(--accent); }
.hbar .name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
.hbar .val { text-align: right; font-size: 12.5px; color: var(--text-2); }
.spark { display: block; margin-top: 10px; }

/* ---------- Layers ---------- */
.scrim { position: fixed; inset: 0; background: rgba(15, 16, 20, .28); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .2s var(--ease); z-index: 20; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 560px; max-width: 94vw; background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow-3); transform: translateX(104%); transition: transform .3s var(--ease); z-index: 21; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer-head { padding: 20px 24px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 14px; }
.drawer-head h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.drawer-body { padding: 18px 24px 32px; overflow-y: auto; flex: 1; }
.kv { display: grid; grid-template-columns: 130px 1fr; row-gap: 10px; font-size: 13.5px; margin: 0; }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; min-width: 0; }
.section-title { font-size: 12px; font-weight: 600; color: var(--text-3); margin: 22px 0 10px; }
.gpu { border: 1px solid var(--border); border-radius: var(--radius-m); padding: 12px 14px; margin-bottom: 8px; }
.gpu-row { display: flex; align-items: center; gap: 10px; font-size: 13px; margin-top: 8px; }
.gpu-row span:first-child { width: 72px; color: var(--text-3); }
.gpu-row .num { width: 80px; text-align: right; color: var(--text-2); font-size: 12.5px; }
.modal { position: fixed; left: 50%; top: 50%; width: 640px; max-width: 94vw; max-height: 88vh; transform: translate(-50%, -48%) scale(.98); opacity: 0; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow-3); transition: opacity .2s var(--ease), transform .25s var(--ease); z-index: 22; display: flex; flex-direction: column; }
.modal.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
.modal-head { padding: 20px 24px 6px; display: flex; gap: 14px; align-items: center; }
.modal-head h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
.modal-body { padding: 8px 24px; overflow-y: auto; }
.modal-foot { padding: 14px 24px 18px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--border); margin-top: 10px; }
.modal-foot .left { margin-right: auto; font-size: 12.5px; color: var(--text-3); }
.form-row { display: grid; grid-template-columns: 160px 1fr; gap: 12px; align-items: center; padding: 8px 0; }
.form-row > label { color: var(--text-2); font-weight: 500; }
.form-row .hint { grid-column: 2; font-size: 12.5px; color: var(--text-3); margin-top: -4px; }
.switch { width: 38px; height: 22px; border-radius: 11px; background: var(--accent); position: relative; cursor: pointer; border: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 19px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .2s var(--ease); }
.switch.off { background: var(--surface-3); }
.switch.off::after { left: 3px; }
.notice { display: flex; gap: 10px; padding: 11px 14px; border-radius: var(--radius-m); background: var(--surface-2); font-size: 13px; color: var(--text-2); margin: 8px 0; }
.notice > svg { color: var(--accent); width: 16px; height: 16px; margin-top: 2px; flex: none; }
.choice { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; margin-bottom: 6px; }
.choice:hover { background: var(--surface-2); }
.choice.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.choice b { font-size: 13.5px; }
.choice small { color: var(--text-3); display: block; font-size: 12px; }
.choice .right { margin-left: auto; text-align: right; font-size: 12.5px; color: var(--text-2); }
.recommend { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--text); }
.recommend svg { color: var(--accent-ink); }
.recommend b { display: block; }
.recommend small { color: var(--text-2); }
.recommend .link { margin-left: auto; font-size: 13px; }
details.advanced { border-top: 1px solid var(--border); margin-top: 10px; padding-top: 10px; }
details.advanced summary { cursor: pointer; color: var(--text-2); font-weight: 550; padding: 4px 0; }
.palette { top: 16%; transform: translate(-50%, 0) scale(.98); width: 580px; }
.palette.open { transform: translate(-50%, 0); }
.palette input { width: 100%; border: 0; outline: 0; background: none; font-size: 16px; padding: 18px 20px; border-bottom: 1px solid var(--border); color: var(--text); }
.palette .results { padding: 8px; max-height: 360px; overflow-y: auto; }
.palette .group { font-size: 11.5px; font-weight: 600; color: var(--text-3); padding: 8px 12px 4px; }
.palette .result { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; cursor: pointer; color: var(--text-2); }
.palette .result.on, .palette .result:hover { background: var(--accent-soft); color: var(--text); }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0; display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 16px; border-radius: 12px; background: var(--text); color: var(--bg); box-shadow: var(--shadow-3); z-index: 30; transition: all .25s var(--ease); pointer-events: none; font-size: 13.5px; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { border: 0; background: color-mix(in srgb, var(--bg) 14%, transparent); color: var(--bg); font-weight: 600; border-radius: 8px; height: 28px; padding: 0 10px; cursor: pointer; }

/* ---------- Deployment ---------- */
.steps { list-style: none; margin: 0; padding: 0; }
.step { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; padding-bottom: 16px; position: relative; }
.step::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 2px; width: 2px; background: var(--border); }
.step:last-child::before { display: none; }
.step.done::before { background: var(--accent); }
.step-dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--border-strong); background: var(--surface); color: var(--text-3); font-size: 12px; font-weight: 600; z-index: 1; }
.step.done .step-dot { background: var(--accent); border-color: var(--accent); color: #fff; }
.step.active .step-dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.step-dot svg { width: 14px; height: 14px; stroke-width: 2.6; }
.step-title { font-weight: 600; padding-top: 3px; }
.step-desc { font-size: 12.5px; color: var(--text-3); }
.step-time { font-size: 12px; color: var(--text-3); padding-top: 4px; }
.progress { height: 4px; border-radius: 2px; background: var(--surface-3); margin-top: 8px; overflow: hidden; }
.progress b { display: block; height: 100%; background: var(--accent); transition: width .4s var(--ease); }
.log { background: var(--log-bg); color: var(--log-text); border-radius: var(--radius-m); font: 12px/1.65 var(--font-mono); padding: 14px 16px; height: 280px; overflow-y: auto; }
.log div { white-space: pre-wrap; }
.log .t { color: #7e808a; margin-right: 10px; }
.log .ok { color: #6fcf7a; }
.code { position: relative; background: var(--surface-2); border-radius: var(--radius-m); padding: 12px 14px; font: 12.5px/1.6 var(--font-mono); overflow-x: auto; white-space: pre; color: var(--text-2); }
.code .copy-abs { position: absolute; top: 8px; right: 8px; }

/* ---------- Catalog ---------- */
.apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--gap); }
.app { padding: 18px; display: flex; flex-direction: column; gap: 12px; transition: box-shadow .2s var(--ease), border-color .2s; }
.app:hover { box-shadow: var(--shadow-2); }
.app-top { display: flex; gap: 12px; align-items: center; }
.app-logo { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 16px; flex: none; }
.app h4 { margin: 0; font-size: 15px; font-weight: 650; }
.app p { margin: 0; color: var(--text-2); font-size: 13.5px; flex: 1; }
.app-foot { display: flex; align-items: center; gap: 8px; }
.app-foot .btn { margin-left: auto; }
.featured { grid-column: 1 / -1; display: grid; grid-template-columns: 1.3fr 1fr; overflow: hidden; }
.featured .left { padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.featured h3 { font-size: 22px; margin: 0; font-weight: 700; letter-spacing: -.02em; }
.featured .right { background: var(--surface-2); padding: 24px; display: flex; flex-direction: column; justify-content: center; gap: 8px; border-left: 1px solid var(--border); }
.bind { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; }
.bind svg { color: var(--accent); width: 16px; height: 16px; }
.empty { padding: 56px 24px; text-align: center; }
.empty .ei { width: 48px; height: 48px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; margin: 0 auto 14px; }
.empty h3 { margin: 0 0 6px; font-size: 16px; }
.empty p { margin: 0 auto 16px; color: var(--text-2); max-width: 420px; }
.foot-note { text-align: center; color: var(--text-3); font-size: 12px; margin-top: 36px; }
</style>
</head>

/* ---------- Feedback ---------- */
let toastTimer = null;
function toast(message, undo) {
  const el = $("#toast");
  el.replaceChildren();
  const span = document.createElement("span"); span.textContent = message; el.append(span);
  if (undo) {
    const b = document.createElement("button"); b.textContent = "Undo";
    b.addEventListener("click", () => { undo(); hideToast(); toast("Change undone"); });
    el.append(b);
  }
  el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, undo ? 6000 : 2400);
}
function hideToast() { $("#toast").classList.remove("show"); }
document.addEventListener("click", e => {
  const c = e.target.closest("[data-copy]");
  if (c) { e.stopPropagation(); navigator.clipboard?.writeText(c.dataset.copy).catch(() => {}); toast("Copied to clipboard"); }
});

function sparkline(values, w = 120, h = 28) {
  const max = Math.max(...values), min = Math.min(...values), step = w / (values.length - 1);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${values.map((v, i) => {
    const bh = Math.max(3, ((v - min) / (max - min || 1)) * (h - 4) + 3);
    return `<rect x="${i * step - 2}" y="${h - bh}" width="4" height="${bh}" rx="2" fill="${i === values.length - 1 ? "var(--accent)" : "var(--deemph)"}"/>`;
  }).join("")}</svg>`;
}

function hbars() {
  const max = Math.max(...MODEL_USE.map(m => m[1]));
  return MODEL_USE.map(([n, v]) => `<div class="hbar" title="${n}: ${fmt(v)} requests"><span class="name mono">${n}</span><div><div class="fill" style="width:${(v / max) * 100}%"></div></div><span class="val num">${fmt(v)}</span></div>`).join("");
}
function mountLineChart() {
  const el = $("#line-chart"), tip = $("#line-tip");
  const W = el.clientWidth, H = 220, P = { l: 36, r: 8, t: 14, b: 26 };
  const x = i => P.l + (i / (LINE.length - 1)) * (W - P.l - P.r);
  const y = v => P.t + (1 - v / 100) * (H - P.t - P.b);
  const pts = LINE.map((v, i) => `${x(i)},${y(v)}`).join(" ");
  const grid = [0, 25, 50, 75, 100].map(v => `<line class="grid-line" x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}"/><text class="axis-text" x="${P.l - 8}" y="${y(v) + 4}" text-anchor="end">${v}%</text>`).join("");
  const xl = [0, 6, 12, 18, 23].map(i => `<text class="axis-text" x="${x(i)}" y="${H - 6}" text-anchor="middle">${String(i).padStart(2, "0")}:00</text>`).join("");
  el.insertAdjacentHTML("afterbegin", `<svg height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Accelerator utilization over 24 hours, from 29% overnight to a peak of 79% at 16:00">
    ${grid}${xl}<polygon class="series-area" points="${x(0)},${y(0)} ${pts} ${x(LINE.length - 1)},${y(0)}"/><polyline class="series-line" points="${pts}"/>
    <text class="axis-text" x="${x(16)}" y="${y(79) - 10}" text-anchor="middle" style="fill:var(--text);font-weight:600">Peak 79%</text>
    <line class="crosshair" id="xh" y1="${P.t}" y2="${H - P.b}" style="opacity:0"/><circle class="marker" id="mk" r="4.5" style="opacity:0"/>
    <rect id="hit" x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent"/></svg>`);
  const hit = $("#hit", el), xh = $("#xh", el), mk = $("#mk", el);
  hit.addEventListener("pointermove", e => {
    const r = el.getBoundingClientRect();
    const i = Math.max(0, Math.min(LINE.length - 1, Math.round(((e.clientX - r.left - P.l) / (W - P.l - P.r)) * (LINE.length - 1))));
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.style.opacity = 1;
    mk.setAttribute("cx", x(i)); mk.setAttribute("cy", y(LINE[i])); mk.style.opacity = 1;
    const s = document.createElement("strong"); s.textContent = LINE[i] + "%";
    const sp = document.createElement("span"); sp.textContent = String(i).padStart(2, "0") + ":00 · utilization";
    tip.replaceChildren(s, sp); tip.style.opacity = 1;
    tip.style.left = Math.min(x(i) + 12, W - 130) + "px"; tip.style.top = (y(LINE[i]) - 50) + "px";
  });
  hit.addEventListener("pointerleave", () => { xh.style.opacity = 0; mk.style.opacity = 0; tip.style.opacity = 0; });
}

function mountDeployment() {

let palIndex = 0, palItems = [];
function paintPalette() {
  const q = $("#palette-input").value.toLowerCase().trim();
  const acts = ACTIONS.filter(a => a.label.toLowerCase().includes(q));
  const targets = TARGETS.filter(t => t.label.toLowerCase().includes(q)).slice(0, q ? 8 : 5);
  palItems = [...acts, ...targets];
  palIndex = Math.min(palIndex, Math.max(0, palItems.length - 1));
  let i = -1;
  const row = it => { i++; return `<div class="result ${i === palIndex ? "on" : ""}" data-i="${i}">${icon(it.ic)}<span>${it.label}</span><span class="subtle" style="margin-left:auto;font-size:12px">${it.keys ? `<kbd>${it.keys}</kbd>` : it.kind}</span></div>`; };
  $("#palette-results").innerHTML = (acts.length ? `<div class="group">Actions</div>${acts.map(row).join("")}` : "") + (targets.length ? `<div class="group">Go to</div>${targets.map(row).join("")}` : "") || `<div class="result subtle">No results for "${$("#palette-input").value.replace(/</g, "&lt;")}"</div>`;
}
function openPalette() { openLayer("#palette"); $("#palette-input").value = ""; palIndex = 0; paintPalette(); setTimeout(() => $("#palette-input").focus(), 30); }
$("#open-palette").addEventListener("click", openPalette);
$("#palette-input").addEventListener("input", () => { palIndex = 0; paintPalette(); });
$("#palette-results").addEventListener("click", e => { const r = e.target.closest("[data-i]"); if (r) { closeAll(); palItems[+r.dataset.i].run(); } });
document.addEventListener("keydown", e => {
  const typing = ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement?.tagName);
  const layerOpen = $("#modal").classList.contains("open") || $("#palette").classList.contains("open");
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && $("#modal").classList.contains("open")) { $("#do-deploy, #do-install")?.click(); return; }
  if (e.key === "Escape") { closeAll(); return; }
  if ($("#palette").classList.contains("open") && ["ArrowDown", "ArrowUp", "Enter"].includes(e.key)) {
    e.preventDefault();
    if (e.key === "ArrowDown") palIndex = Math.min(palItems.length - 1, palIndex + 1);
    if (e.key === "ArrowUp") palIndex = Math.max(0, palIndex - 1);
    if (e.key === "Enter" && palItems[palIndex]) { const it = palItems[palIndex]; closeAll(); it.run(); return; }
    paintPalette(); return;
  }
  if (typing || layerOpen || e.metaKey || e.ctrlKey || e.altKey) return;
  const map = { d: "deploy", i: "install", n: "node", k: "key" };
  if (map[e.key]) { e.preventDefault(); runAction(map[e.key]); }
  if (e.key === "/" && $("#node-q")) { e.preventDefault(); $("#node-q").focus(); }
});
$("#theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme !== "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("#theme").innerHTML = icon(dark ? "i-sun" : "i-moon");
});
$("#density").addEventListener("click", () => { const d = document.documentElement.dataset; d.density = d.density === "compact" ? "comfortable" : "compact"; });
const params = new URLSearchParams(location.search);
if (params.get("theme") === "dark") { document.documentElement.dataset.theme = "dark"; $("#theme").innerHTML = icon("i-sun"); }
let resizeTimer = null;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { const el = $("#line-chart"); if (!el) return; el.querySelector("svg")?.remove(); mountLineChart(); }, 120); });
window.addEventListener("hashchange", route);
route();
</script>
</body>
