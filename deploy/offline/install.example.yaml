# Typed configuration for ownsolid-install. Unknown keys and invalid values are refused
# before anything changes on the host. Secrets are generated under install_root, or
# referenced by file path; none belong in this file. Changes apply on the next `apply`.

# Required. Always 1 for this format.
format_version: 1

topology:
  # Optional, default single-node. Enum single-node, ha, cell, multi-cell, multi-site.
  # `ownsolid-install capabilities` lists which this release runs; the others fail with
  # CONFIG_TOPOLOGY_SIZE_NOT_SUPPORTED and change nothing.
  size: single-node

# Required. Absolute path owned by the installer; holds configuration, secrets and data.
install_root: /srv/ownsolid

# Required. Absolute path of the delivered compose.yaml, copied under install_root.
compose_file: /opt/ownsolid-bundle/compose.yaml

# Optional, default ownsolid. Compose project name; lowercase letters, digits, - and _.
project: ownsolid

# Optional. Numeric users; the platform never runs as root. Defaults match the images.
runtime:
  uid: 10001
  gid: 10001
  postgres_uid: 999

images:
  # Optional. docker save archive loaded before start. Without it the images must already
  # be on this host. Nothing is ever pulled.
  archive_file: /opt/ownsolid-bundle/images.tar
  # Required. Tag or digest; latest is refused.
  control: ownsolid/control:0.0.0-example
  # Required. PostgreSQL 18.6 with pgvector 0.8.7.
  postgres: pgvector/pgvector@sha256:c29f30688a9ad961691bdf0ec1650717cc132a5814619d80f80463d6e4c42e47
  # Required. Telemetry stores, VictoriaMetrics v1.155.0 and VictoriaLogs v1.53.0.
  metrics: victoriametrics/victoria-metrics@sha256:f60dc268b54ecf87f6e09d740c2b732838aa9193090cc741417c9f6386a130df
  logs: victoriametrics/victoria-logs@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d

# Optional. Host address and port of the HTTPS listener. Defaults 127.0.0.1 and 8443.
# Separate from the advertised origins below.
network:
  bind_address: 127.0.0.1
  https_port: 8443
  # Optional, default 172.31.254.0/26. Private IPv4 subnet, /16 to /28, of the internal
  # network that carries database and telemetry traffic; it must not overlap a network
  # this host reaches. The stores take fixed addresses in it, so none is ever looked up
  # in DNS. Changing it on an existing installation needs `docker compose down` first.
  state_subnet: 172.31.254.0/26

# Required. Browser origins, https only, and different from each other: the host name
# selects the audience. Use your real host names or IP addresses.
origins:
  portal: https://portal.example.invalid:8443
  admin: https://admin.example.invalid:8443

tls:
  # Optional, default generate: a private CA under install_root issues a certificate for
  # the origin hosts and reissues it when they change. Clients must trust config/ca.pem.
  # Use files to supply your own; certificate_file, private_key_file and ca_file are then
  # required, and ca_file must be the CA that issued the certificate.
  source: generate
  # Optional, default 720 (30 days), 24 to 8760: how long a node's client certificate lasts.
  # Nodes replace theirs without restarting. Use this for a site with long offline periods.
  # agent_certificate_lifetime_hours: 720

license:
  # Required. Public trust file from the license issuer. Never a signing key.
  trust_file: /opt/ownsolid-bundle/license-trust.json

smtp:
  # Required. Internal relay used for account mail.
  host: smtp.example.invalid
  # Optional, default 587.
  port: 587
  # Required.
  from_address: platform@example.invalid
  # Optional, default starttls_required. Enum starttls_required, implicit_tls.
  tls_mode: starttls_required
  # Optional. CA file for the relay. username and password_file go together, and the
  # password is read from the file.
  # ca_file: /opt/ownsolid-bundle/smtp-ca.pem
  # username: platform
  # password_file: /opt/ownsolid-bundle/smtp-password

# Required. First administrator and tenant. The password is generated once and written to
# <install_root>/operator/admin-credential; a later apply never replaces it.
administrator:
  email: admin@example.invalid
  display_name: Installation Administrator
  installation_name: Example
  workspace_name: Default Workspace

# Optional. Container limits. Defaults as shown.
resources:
  control_memory: 1g
  control_cpus: "2"
  postgres_memory: 2g
  # The database's share of the host when CPUs are contended, not a ceiling: it may use idle
  # CPUs, because a hard limit stalls every query once a burst has spent it (ADR 0038).
  postgres_cpus: "2"
  postgres_max_connections: 50
  # The serving role's connection limit, shared by control and any agent gateways beside it
  # (ADR 0048): control's pool of 10 plus each gateway's. 0 keeps control's pool. At most
  # postgres_max_connections less 10, which stay for operator commands and the database's own.
  database_role_connections: 0
  metrics_memory: 2g
  metrics_cpus: "2"
  logs_memory: 1g
  logs_cpus: "1"

# Optional. How long the telemetry stores keep data, in whole days. Defaults as shown.
telemetry:
  metrics_retention: 30d
  logs_retention: 30d

# Optional, default 600. Time limit of each install step, 30 to 7200 seconds.
step_seconds: 600

# Optional, default 3600. Time limit of a whole backup or restore, 60 to 86400 seconds.
backup_seconds: 3600

# Optional. Further control plane settings, as documented in
# services/control/config/examples/control/control.example.yaml. The control process
# validates them. topology, server, database, security, licensing and smtp are set from
# the fields above and are refused here.
# control_settings:
#   runtime:
#     workspaces:
#       maximum_count: 100

# Optional. Set the host requirements for this site. With this block present,
# both `preflight` and `apply` check the Linux amd64 host before preparing files.
# Budget separately for persisted application data and expanded Docker images.
# preflight:
#   minimum_kernel: "5.15.0"
#   minimum_data_free_bytes: 10737418240
#   minimum_docker_free_bytes: 4294967296
#   minimum_memory_bytes: 8589934592
#   # Required UTC lower bound from a trusted offline reference.
#   minimum_utc: "2026-01-01T00:00:00Z"
#   # Optional. Require Linux to report synchronization with a site time source.
#   require_clock_sync: false
#   # Required only when the local Docker uses the containerd image store.
#   # containerd_root: /var/lib/containerd
#   # Optional. Use only this in-site resolver if /etc/hosts has no entry.
#   # dns_server: 192.168.100.53:53
#   # Optional. Enable only on a host that must already have NVIDIA GPUs.
#   require_nvidia: false

# Optional systemd scheduled backup policy. Use an empty private directory on the
# backup filesystem. deploy/systemd/README.md describes the timer.
# backup_schedule:
#   directory: /private/ownsolid-backups
#   retain: 7
