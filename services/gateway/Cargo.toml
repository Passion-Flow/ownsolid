[package]
name = "projectone-gateway"
version = "0.7.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
axum = { version = "=0.8.9", features = ["json", "http1", "tokio"] }
axum-server = { version = "=0.8.0", features = ["tls-rustls-no-provider"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
time = "=0.3.55"
futures-util = "=0.3.34"
hyper-util = { version = "=0.1.21", features = ["tokio"] }
async-stream = "=0.3.6"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
sha2 = "=0.11.1"
subtle = "=2.6.1"
nix = { version = "=0.31.3", features = ["user", "fs"] }

[dev-dependencies]
rcgen = "=0.14.10"

[features]
tokenizer-integration = []
process-integration = []
