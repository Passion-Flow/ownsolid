# Serve this Alertmanager on an operator-only network. Labels must come from
# trusted rules or ingestion. Keep tenant_id in every group and inhibit rule.
route:
  receiver: discard
  group_by: [tenant_id, alertname, site_id, cell_id, rack_id]
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - receiver: tenant-a-matrix
      matchers:
        - tenant_id="tenant-a"
      routes:
        - receiver: tenant-a-matrix
          matchers:
            - rack_id=""
            - node_id!=""
          group_by: [tenant_id, alertname, site_id, cell_id, node_id]
    - receiver: tenant-b-matrix
      matchers:
        - tenant_id="tenant-b"
      routes:
        - receiver: tenant-b-matrix
          matchers:
            - rack_id=""
            - node_id!=""
          group_by: [tenant_id, alertname, site_id, cell_id, node_id]
receivers:
  - name: discard
  - name: tenant-a-matrix
    webhook_configs:
      - url_file: /etc/ownsolid/relay/tenant-a-url
        timeout: 10s
        send_resolved: true
        http_config:
          follow_redirects: false
          authorization:
            type: Bearer
            credentials_file: /etc/ownsolid/relay/tenant-a-webhook
          tls_config:
            ca_file: /etc/ownsolid/relay/relay-ca.pem
  - name: tenant-b-matrix
    webhook_configs:
      - url_file: /etc/ownsolid/relay/tenant-b-url
        timeout: 10s
        send_resolved: true
        http_config:
          follow_redirects: false
          authorization:
            type: Bearer
            credentials_file: /etc/ownsolid/relay/tenant-b-webhook
          tls_config:
            ca_file: /etc/ownsolid/relay/relay-ca.pem
inhibit_rules:
  - source_matchers:
      - alertname="OwnsolidRackUnreachable"
      - tenant_id!=""
      - site_id!=""
      - cell_id!=""
      - rack_id!=""
    target_matchers:
      - alertname="OwnsolidNodeUnreachable"
      - tenant_id!=""
      - site_id!=""
      - cell_id!=""
      - rack_id!=""
    equal: [tenant_id, site_id, cell_id, rack_id]
