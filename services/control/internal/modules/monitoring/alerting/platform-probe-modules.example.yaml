modules:
  private_https_ready:
    prober: http
    timeout: 4s
    http:
      method: GET
      valid_status_codes: [200]
      follow_redirects: false
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      body_size_limit: 16KB
      tls_config:
        ca_file: /etc/ownsolid/monitoring/site-ca.pem
        min_version: TLS12
