# Deployment size. Optional; omitted selects single-node. Enum single-node, ha, cell,
# multi-cell, multi-site. This release runs single-node only; the others fail startup
# with CONFIG_TOPOLOGY_SIZE_NOT_SUPPORTED. No secret; restart applies.
topology:
  size: single-node
server:
  listen_address: 0.0.0.0:8443
  portal_origin: https://portal.example.invalid:8443
  admin_origin: https://admin.example.invalid:8443
  tls_certificate_file: /run/projectone/certificate.pem
  tls_private_key_file: /run/projectone/private-key.pem
  portal_assets: /opt/projectone/portal
  admin_assets: /opt/projectone/admin
database:
  # Control database owner; string postgresql/mysql, optional default postgresql.
  # Protected PROJECT_ONE_DATABASE_ENGINE overrides valid YAML; no secret; restart/new pool.
  engine: postgresql
  # For mysql, remove dsn_file and select an existing protected mysqlstore JSON via
  # mysql_configuration_file or PROJECT_ONE_MYSQL_CONFIGURATION_FILE. No fallback.
  # That file alone owns MySQL TLS/password-file references and connection policy.
  # Optional mysql_migrations budgets are documented in database-selection.env.example.
  # Optional mysql_backup is MySQL-only local native backup/isolated-restore policy.
  # Required explicit client_file/client_sha256/dump_file/dump_sha256/artifact_manifest_file
  # and scratch_root reference pinned offline binaries, their actual GPL artifact manifest
  # and an existing private0700 scratch directory; there are no path/digest defaults.
  # operation_seconds default3600 (30..86400), termination_grace_seconds default10 (1..60),
  # maximum_sql_bytes default17179869184 (1048576..1099511627776), maximum_manifest_bytes
  # default1048576 (4096..16777216), maximum_store_bytes default137438953472
  # (1048576..1099511627776), maximum_store_files default1000000 (1..1000000),
  # minimum_free_bytes default1073741824
  # (1048576..1099511627776) additionally preserve the fixed30-percent free-space floor.
  # No credentials here: endpoint/password/CA/version remain in the existing MySQL JSON.
  # See database-selection.env.example for every explicit protected env mapping/precedence.
  # Native commands only, no process starts in serve; new command/restart applies changes.
  # Optional mysql_runtime_access is MySQL-only operator provisioning/recovery policy.
  # Both account_host (one canonical source DNS/IP, no wildcard/default) and intent_file
  # (canonical protected private intent path, no default) are required when present.
  # Runtime User/password/TLS/endpoint remain solely in the protected MySQL JSON.
  # See database-selection.env.example for protected env mappings/restart behavior.
  # Runtime role has DML/SELECT rights, never schema ownership or CREATE rights.
  # Use a separate operator configuration/DSN for migrations.
  dsn_file: /run/projectone/runtime-dsn
  max_open_connections: 10
  max_idle_connections: 2
  statement_timeout_seconds: 5
  # Control PostgreSQL session owner; integer milliseconds, optional default 3000.
  # Permitted 1..30000 and less than statement_timeout_seconds*1000; restart/new pool.
  # Protected serve --env-file PROJECT_ONE_DATABASE_LOCK_TIMEOUT_MILLISECONDS overrides valid YAML.
  # Public nonsecret policy; ambient process environment is not read. Zero/null/invalid values fail.
  lock_timeout_milliseconds: 3000
security:
  auth_hmac_key_file: /run/projectone/auth-hmac
  mail_keyring_file: /run/projectone/mail-keyring.json
  password_blocklist_file: /opt/projectone/security/password-blocklist.txt
# Required public manufacturer trust; provision with the same private generation.
# Helm places all references beneath its selected privateMountPath/private child.
# Omit environment_file unless the optional component overlay is also projected.
licensing:
  trust_file: /run/projectone/license-trust.json
sso:
  enabled: false
  keyring_file: ""
  providers: []
smtp:
  host: smtp.example.invalid
  port: 587
  from_address: platform@example.invalid
  tls_mode: starttls_required
  ca_file: /run/projectone/smtp-ca.pem
  connect_timeout_seconds: 5
  operation_timeout_seconds: 20

components:
  node_exporter_catalog_directory: /opt/projectone/components/node-exporter/catalog
  node_exporter_archive_file: /opt/projectone/components/node-exporter/node_exporter-1.12.1.linux-amd64.tar.gz

