# Optional private S3 ingestion owner; boolean false/omitted keeps existing local stores authoritative.
# Owner: typed control ObjectStorage configuration. While false, every other object_storage field must
# be omitted. Enabling requires the complete object-storage example, real local model/dataset owners,
# preinitialized private stage and actual qualified private endpoint. Protected --env-file explicitly
# overrides YAML; ambient process values are ignored. Secrets remain protected file references; restart required.
object_storage: {enabled: false}

# Optional image registry owner; canonical absolute protected JSON reference, no
# default. Omit to disable; present empty/null/relative values fail. The private
# serve --env-file PROJECT_ONE_REGISTRY_CONFIG_FILE overrides valid YAML; ambient
# environment is ignored. JSON owns endpoint/CA/credential/policies/CAS/prepared
# paths, with the existing registry/control.schema.json. Restart required.
# image_registry_config_file: /run/projectone/registry-control.json

# M26 owner: optional canonical absolute protected JSON reference (string).
# Omission disables maintenance. Must exist0600 under owned0700 parent; no inline
# credentials. PROJECT_ONE_MIDDLEWARE_CONFIG_FILE in explicit serve --env-file
# overrides this reference, then middleware.LoadFiles validates it at startup.
# Restart required. Customer external profiles remain read-only. PostgreSQL
# control backend only until the independent MySQL catalog is activated.
# middleware_config_file: /run/projectone/middleware.json
# M26 owner: optional protected policy env-file reference (string), distinct from
# JSON. Omit for JSON/default policy; no empty/false values. Explicit serve
# --env-file PROJECT_ONE_MIDDLEWARE_ENVIRONMENT_FILE overrides YAML. Its declared
# policy keys override JSON; no ambient reads. Restart required.
# middleware_environment_file: /run/projectone/middleware-policy.env

# Task-events owner: optional root component; omission or false-only disables.
# Enabled configuration requires all31 fields from task-events/control.example.yaml.
# Explicit protected --env-file PROJECT_ONE_TASK_EVENTS_* overrides valid YAML.
# Runtime serving requires exact installed tenant/schema/broker admission;
# lifecycle/route qualification remains separately recorded. No broker, credentials or resource is provisioned here.
task_events:
  enabled: false

# Optional. Log store of ADR 0009; ownsolid-install writes this section. Without it,
# component logs report STORAGE_UNAVAILABLE and the rest of the platform runs normally.
# telemetry:
#   logs_address: http://172.31.254.4:9428
#   request_timeout_seconds: 5
#   queue_capacity: 4096

# M30 owner: optional canonical absolute protected JSON file, no default.
# Omit to disable diagnostics; present empty/null/false/relative values fail.
# PROJECT_ONE_MONITORING_CONFIG_FILE in explicit serve --env-file overrides valid
# YAML; ambient environment is ignored. Policy/ranges/defaults are owned by
# monitoring/monitoring.schema.json. No credential or exporter URL is accepted.
# Mount privately0600 under owned0700 parent; restart applies policy/resets epoch.
# Optional private-cluster component reference; protected JSON, explicit env-file override.
# Omission disables this component; restart applies its policy and protected references.
# private_cluster_config_file: /run/projectone/config/private-cluster.json
# monitoring_config_file: /run/projectone/config/monitoring.json

# Owner: release-view Admin readonly projection; optional absolute protected JSON reference.
# String; omit to keep unavailable, explicit empty/false invalid. See admin-view.schema.json.
# Same PROJECT_ONE_RELEASE_VIEW_CONFIG_FILE in explicit --env-file overrides this reference.
# No secrets; preserve private input mode. Changing reference/policy requires restart.
# release_view_config_file: /run/projectone/config/admin-view.json
