# Minimal M01+M02+M03 inputs. Copy to a private operator/runtime configuration and provision
# every secret/asset reference below. Restart after edits; no secret bytes belong here.
server:
  # Enum account|workspaces|nodes|platform; omitted preserves platform. Same artifact, restart required.
  application_profile: nodes
  # Verified HTTPS for both browser and agent. HTTP browser deployments require
  # a separate machine_server HTTPS listener/origin; keep advertised origins separate from listen/bind.
  transport_mode: http
  listen_address: 127.0.0.1:8080
  portal_origin: http://localhost:8080
  admin_origin: http://127.0.0.1:8080
  portal_assets: /opt/projectone/portal
  admin_assets: /opt/projectone/admin
# Machine transport owner; all fields required together; no defaults or live reload.
# The listener and exact HTTPS origin are independent from browser plaintext selection.
machine_server:
  # String host:port, canonical port 1..65535; match the Compose target port; restart.
  listen_address: 127.0.0.1:9443
  # Exact HTTPS origin, trusted DNS/IP SAN and CA; no path/redirect/fallback; restart.
  origin: https://127.0.0.1:9443
  # Protected PEM certificate/key references owned by control; required; restart.
  tls_certificate_file: /run/projectone/machine.pem
  tls_private_key_file: /run/projectone/machine.key
database:
  engine: postgresql
  # Runtime role: schema USAGE, business DML, SELECT-only schema_migrations.
  # The separate operator copy points to its protected migration/operator DSN.
  dsn_file: /run/projectone/runtime-dsn
  max_open_connections: 8
  max_idle_connections: 1
  statement_timeout_seconds: 5
security:
  auth_hmac_key_file: /run/projectone/auth-hmac
  mail_keyring_file: /run/projectone/mail-keyring.json
  password_blocklist_file: /opt/projectone/security/password-blocklist.txt
smtp:
  host: smtp.internal
  port: 587
  from_address: platform@example.invalid
  tls_mode: starttls_required
  ca_file: /run/projectone/smtp-ca.pem
  connect_timeout_seconds: 5
  operation_timeout_seconds: 20
licensing:
  # Manufacturer public verification trust. Signing keys are never runtime inputs.
  trust_file: /run/projectone/license-trust.json
