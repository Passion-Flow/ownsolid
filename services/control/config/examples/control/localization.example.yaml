# Install only a compatible owned offline component inventory, then restart.
# These are explicit operator-selected paths; this example provisions no asset.
localization:
  package_directory: /var/lib/projectone/localization
  required_locales: [en, zh-CN]
runtime:
  localization:
    package_bytes: 1048576
    font_bytes: 18874368
    aggregate_bytes: 33554432
    maximum_locales: 4
    maximum_messages: 5000
    maximum_fonts: 2
    cache_seconds: 600
