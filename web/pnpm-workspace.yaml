packages:
  - apps/*
  - packages/*

# One pinned version per dependency for the whole workspace. Packages refer to these
# entries with `catalog:`; change a version here and nowhere else.
catalog:
  '@axe-core/playwright': 4.14.0
  '@eslint/js': 10.0.1
  '@fontsource-variable/figtree': 5.3.0
  '@fontsource-variable/jetbrains-mono': 5.3.0
  '@playwright/test': 1.64.1
  '@tailwindcss/vite': 4.3.4
  '@tanstack/react-query': 5.105.3
  '@tanstack/react-router': 1.170.46
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.8
  '@types/mdast': 4.0.4
  '@types/node': 26.6.6
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.2.1
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  cmdk: 1.1.1
  eslint-plugin-jsx-a11y-x: 0.2.0
  eslint-plugin-react-hooks: 7.1.1
  eslint: 10.14.0
  globals: 17.14.0
  jsdom: 30.1.3
  lucide-react: 1.66.0
  mdast-util-from-markdown: 2.1.0
  mdast-util-gfm-table: 2.0.0
  micromark-extension-gfm-table: 2.1.2
  openapi-typescript: 7.13.0
  prettier: 3.9.10
  radix-ui: 1.8.1
  react-dom: 19.3.1
  react: 19.3.1
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.4
  typescript-eslint: 8.72.1
  typescript: 6.0.3
  vite: 8.3.5
  vitest: 5.1.0

# openapi-typescript asks for TypeScript 5 but generates correctly with 6; the drift check
# and the compiler verify its output on every run.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: '6'
